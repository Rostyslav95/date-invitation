<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#384936">
<title>У меня есть к тебе вопрос</title>
<style>
:root{--green:#384936;--deep:#263527;--light:#a9b49c;--cream:#f4f2e9;--gold:#c7ad75;--ink:#f6f5ef}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 18% 12%,#64745a 0,transparent 34%),radial-gradient(circle at 88% 88%,#1e2b20 0,transparent 38%),var(--deep);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.card{width:min(100%,520px);text-align:center;padding:clamp(30px,8vw,54px) 26px;background:linear-gradient(145deg,#435640,#2e3d2e);border:1px solid #87927b66;box-shadow:0 24px 80px #10181088;border-radius:26px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:10px;border:1px solid #c7ad7555;border-radius:18px;pointer-events:none}
.ornament{font-size:25px;color:var(--gold);letter-spacing:9px}
h1{font-size:clamp(34px,8vw,48px);line-height:1.12;font-weight:400;margin:24px 0 16px}
p{color:#e0e4d9;font-family:system-ui,sans-serif;font-size:16px;line-height:1.7;margin:0 auto;max-width:390px}
.note{margin:28px auto;padding:19px 17px;border-top:1px solid #c7ad7577;border-bottom:1px solid #c7ad7577;max-width:370px;color:#f4f0e5;font-family:system-ui,sans-serif;font-size:16px;line-height:1.65}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{border:1px solid var(--gold);border-radius:999px;padding:14px 21px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .18s,background .18s}
button:hover{transform:translateY(-2px)}
.primary{background:var(--gold);color:#263126}
.secondary{background:transparent;color:#f5f2e8}
#reply{min-height:48px;margin-top:22px;color:#e5d2a6;font-family:system-ui,sans-serif;font-size:15px;line-height:1.5}
footer{margin-top:24px;font:12px system-ui,sans-serif;color:#c1c9b8}
</style>
</head>
<body>
<main class="card">
  <div class="ornament">✦ ✧ ✦</div>
  <h1>У меня есть к тебе<br>один вопрос…</h1>
  <p>Не хотелось приглашать тебя обычным сообщением, поэтому я подготовил кое-что особенное.</p>
  <div class="note">Как насчёт сходить со мной на свидание?<br>Хочу провести с тобой приятный вечер.</div>
  <div class="actions">
    <button class="primary" onclick="answer('yes')">Да, с удовольствием</button>
    <button class="secondary" onclick="answer('details')">Какие планы?</button>
  </div>
  <div id="reply" aria-live="polite"></div>
  <footer>Немного волнения. Много искренности.</footer>
</main>
<script>
function answer(choice){
 const reply=document.getElementById('reply');
 reply.textContent = choice==='yes'
 ? 'Тогда договорились. Осталось выбрать день и место ✨'
 : 'Хочу придумать вечер, который понравится нам обоим. Обсудим?';
}
</script>
</body>
</html>
